name: Userscript acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - feat/test-suite
    paths:
      - .github/workflows/userscript-acceptance.yml
      - packages/core/**
      - packages/test/**
      - packages/cli/src/**
      - packages/react/src/**
      - packages/vue/src/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

concurrency:
  group: userscript-acceptance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/core/test/frameworks/pnpm-lock.yaml
            packages/core/test/e2e/pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core and test package
        run: |
          pnpm build:core
          pnpm --filter @makoojs/test build

      - name: Install isolated test dependencies
        run: |
          pnpm -C packages/core/test/frameworks install --frozen-lockfile
          pnpm -C packages/core/test/e2e install --frozen-lockfile

      - name: Verify core artifact contracts
        run: |
          pnpm store add fflate@0.8.2
          pnpm exec vitest run --config packages/core/test/artifacts/vitest.config.ts

      - name: Install Chromium and system dependencies
        run: pnpm -C packages/core/test/e2e exec playwright install --with-deps chromium

      - name: Prepare pinned Violentmonkey
        run: pnpm -C packages/core/test/e2e run prepare:manager

      - name: Run repeated browser and fault acceptance
        run: pnpm -C packages/core/test/e2e test:acceptance

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: userscript-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/core/test/e2e/acceptance-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload JSON reports and runner logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: userscript-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packages/core/test/e2e/acceptance-results/**/report.json
            packages/core/test/e2e/acceptance-results/**/runner.log
          if-no-files-found: warn
          retention-days: 14
