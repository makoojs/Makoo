name: NPM & GitHub Auth Tester

on:
  workflow_dispatch: # 只允许手动点击触发，不干扰任何提交

permissions:
  contents: read
  id-token: write

jobs:
  test-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
          always-auth: false

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
          npm config delete "//registry.npmjs.org/:_authToken" || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Validate npm trusted publishing
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC is not available. The job needs id-token: write."
            exit 1
          fi
          echo "OIDC is available for npm trusted publishing."
          pnpm publish -r --dry-run --access public --no-git-checks

      - name: Validate GitHub Token
        # 检查是否有权访问 gh cli 和 release 接口
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking GitHub CLI..."
          gh release list --limit 1
          echo "GitHub Token has sufficient permissions."
